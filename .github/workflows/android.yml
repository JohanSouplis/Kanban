name: Android

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK release
        run: ./gradlew testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kanban-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk kanban.apk

      - name: Publier la release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Kanban ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: kanban.apk
